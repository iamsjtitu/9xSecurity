name: Build 9x Security (Windows EXE)

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: 9x_security
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: 9x_security/requirements.txt

      - name: Read app version
        id: ver
        shell: bash
        run: |
          V=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' updater.py)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "App version: $V"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Pre-build matplotlib font cache
        run: python -c "import matplotlib; matplotlib.use('Agg'); import matplotlib.pyplot; print('font cache ready')"

      - name: Build app folder (onedir - fast build, fast startup)
        run: >
          pyinstaller --noconfirm --windowed --name "9xSecurity"
          --add-data "yolov8n.pt;."
          --collect-data ultralytics
          --collect-data easyocr
          --exclude-module tkinter
          --exclude-module IPython
          --exclude-module pytest
          --exclude-module notebook
          main.py

      - name: Zip app folder
        shell: pwsh
        run: Compress-Archive -Path dist\9xSecurity -DestinationPath "dist\9xSecurity-v${{ steps.ver.outputs.version }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 9xSecurity-zip
          path: 9x_security/dist/9xSecurity-v${{ steps.ver.outputs.version }}.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: 9x Security v${{ steps.ver.outputs.version }}
          files: 9x_security/dist/9xSecurity-v${{ steps.ver.outputs.version }}.zip
          make_latest: true
