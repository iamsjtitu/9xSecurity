name: Build 9x Security (Windows Installer)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: 9x_security
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: 9x_security/requirements.txt

      - name: Set automatic version (1.0.<build number>)
        id: ver
        shell: bash
        run: |
          V="1.0.${{ github.run_number }}"
          sed -i "s/^APP_VERSION = .*/APP_VERSION = \"$V\"/" updater.py
          sed -i "s|^DEFAULT_REPO = .*|DEFAULT_REPO = \"$GITHUB_REPOSITORY\"  # baked|" updater.py
          grep "^APP_VERSION\|^DEFAULT_REPO" updater.py
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Pre-build matplotlib font cache
        run: python -c "import matplotlib; matplotlib.use('Agg'); import matplotlib.pyplot; print('font cache ready')"

      - name: Build app folder (onedir - fast build, fast startup)
        run: >
          pyinstaller --noconfirm --windowed --name "9xSecurity"
          --add-data "yolov8n.pt;."
          --collect-data ultralytics
          --collect-data easyocr
          --collect-binaries imageio_ffmpeg
          --exclude-module tkinter
          --exclude-module IPython
          --exclude-module pytest
          --exclude-module notebook
          main.py

      - name: Build Setup installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /DAppVersion=${{ steps.ver.outputs.version }} installer.iss

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 9xSecurity-setup
          path: 9x_security/dist/9xSecuritySetup-v${{ steps.ver.outputs.version }}.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: 9x Security v${{ steps.ver.outputs.version }}
          files: 9x_security/dist/9xSecuritySetup-v${{ steps.ver.outputs.version }}.exe
          make_latest: true
