name: Build 9x Security (Windows EXE)

on:
  push:
    tags:
      - "v*"          # e.g. push tag v1.0.1 to build + publish a release
  workflow_dispatch: {}   # or trigger manually from the Actions tab

permissions:
  contents: write     # needed to create the Release

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: 9x_security
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build single-file EXE
        run: pyinstaller --noconfirm --onefile --windowed --name "9xSecurity" --add-data "yolov8n.pt;." main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 9xSecurity-exe
          path: 9x_security/dist/9xSecurity.exe

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: 9x_security/dist/9xSecurity.exe
