name: Build 9x Security (Windows Installer)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: 9x_security
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: 9x_security/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: 9x_security/electron/package.json

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('9x_security/electron/package.json') }}

      - name: Set automatic version (1.0.<build number>)
        id: ver
        shell: bash
        run: |
          V="1.0.${{ github.run_number }}"
          sed -i "s/^APP_VERSION = .*/APP_VERSION = \"$V\"/" updater.py
          sed -i "s|^DEFAULT_REPO = .*|DEFAULT_REPO = \"$GITHUB_REPOSITORY\"  # baked|" updater.py
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('electron/package.json'));p.version='$V';fs.writeFileSync('electron/package.json',JSON.stringify(p,null,2));"
          grep "^APP_VERSION\|^DEFAULT_REPO" updater.py
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Bake inbuilt GitHub update token (repo secret UPDATE_TOKEN)
        shell: bash
        env:
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          if [ -z "$UPDATE_TOKEN" ]; then
            echo "::warning::Repo secret UPDATE_TOKEN set nahi hai — private repo par in-app updates ke liye user ko Settings > Updates me token daalna padega. Set karein: repo Settings > Secrets and variables > Actions > New repository secret > UPDATE_TOKEN"
            exit 0
          fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $UPDATE_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY")
          if [ "$CODE" != "200" ]; then
            echo "::error::UPDATE_TOKEN is repo ko access nahi kar pa raha (HTTP $CODE). Fine-grained token banayein: Repository access = ye repo, Permissions > Contents: Read-only. Expiry check karein."
            exit 1
          fi
          sed -i "s|^DEFAULT_TOKEN = .*|DEFAULT_TOKEN = \"$UPDATE_TOKEN\"  # baked|" updater.py
          grep -q "^DEFAULT_TOKEN = \"$UPDATE_TOKEN\"" updater.py && echo "Inbuilt update token baked OK (verified against $GITHUB_REPOSITORY)"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Cache EasyOCR models
        uses: actions/cache@v4
        with:
          path: 9x_security/easyocr_models
          key: easyocr-models-en-v1

      - name: Download EasyOCR models (bundled for offline plate reading)
        run: python -c "import easyocr; easyocr.Reader(['en'], gpu=False, verbose=False, model_storage_directory='easyocr_models', download_enabled=True); print('models ready')"

      - name: Pre-build matplotlib font cache
        run: python -c "import matplotlib; matplotlib.use('Agg'); import matplotlib.pyplot; print('font cache ready')"

      - name: Build engine (PyInstaller onedir)
        run: >
          pyinstaller --noconfirm --name "9xEngine"
          --add-data "yolov8n.pt;."
          --add-data "easyocr_models;easyocr_models"
          --collect-data ultralytics
          --collect-data easyocr
          --collect-binaries imageio_ffmpeg
          --exclude-module tkinter
          --exclude-module IPython
          --exclude-module pytest
          --exclude-module notebook
          --exclude-module PyQt5
          service.py

      - name: Build Electron UI + NSIS installer
        working-directory: 9x_security/electron
        run: |
          yarn install
          yarn build
          yarn electron-builder --win nsis --publish never

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 9xSecurity-setup
          path: 9x_security/electron/release/9xSecuritySetup-v${{ steps.ver.outputs.version }}.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: 9x Security v${{ steps.ver.outputs.version }}
          files: 9x_security/electron/release/9xSecuritySetup-v${{ steps.ver.outputs.version }}.exe
          make_latest: true
