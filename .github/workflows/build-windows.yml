name: Build 9x Security (Windows EXE)

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: 9x_security
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read app version
        id: ver
        shell: bash
        run: |
          V=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' updater.py)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "App version: $V"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build single-file EXE
        run: pyinstaller --noconfirm --onefile --windowed --name "9xSecurity" --add-data "yolov8n.pt;." main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 9xSecurity-exe
          path: 9x_security/dist/9xSecurity.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: 9x Security v${{ steps.ver.outputs.version }}
          files: 9x_security/dist/9xSecurity.exe
          make_latest: true
